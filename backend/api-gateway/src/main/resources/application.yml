server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local dev default (overridden by docker-compose's env var, which
          # points at the "auth" service hostname on the compose network
          # instead). Production issuer is https://auth.please-support-me.com/realms/support-me.
          issuer-uri: http://localhost:8081/realms/support-me

  # Spring gRPC client channel configuration (blocking stubs, plaintext for local dev only -
  # switch to TLS/mTLS before any shared or production deployment).
  # TODO: verify property namespace/shape against https://github.com/spring-projects/spring-grpc
  grpc:
    client:
      channels:
        organization:
          address: static://organization:9091
          negotiation-type: plaintext
        initialization:
          address: static://initialization:9092
          negotiation-type: plaintext

app:
  keycloak-admin:
    # Local dev default (non-docker) - overridden by docker-compose's env var, which points at
    # the "auth" service hostname on the compose network instead, same split as jwk-set-uri
    # above. Authenticates as the Keycloak bootstrap admin; see KeycloakUserDirectory's class
    # doc for why that's local-dev-only.
    base-url: http://localhost:8081
    realm: support-me
    admin-realm: master
    admin-client-id: admin-cli
    admin-username: admin
    admin-password: admin

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
