# Mounts the same Keycloak admin bootstrap password used by auth/secretproviderclass.yaml and
# syncs it into a native K8s Secret (api-gateway-keycloak-admin-credentials) so the Deployment can
# use a plain secretKeyRef - see
# https://secrets-store-csi-driver.sigs.k8s.io/topics/sync-as-kubernetes-secret.
# Needed so KeycloakUserDirectory (SCRUM-188 user search) can authenticate against Keycloak's
# Admin REST API as the real production admin instead of falling back to application.yml's
# local-dev-only admin/admin default.
# ${GCP_PROJECT_NUMBER} substituted by scripts/render-k8s-manifests.sh - Secret Manager's CSI
# provider addresses secrets by project NUMBER, not project ID.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-gateway-secret
  namespace: support-me
spec:
  provider: gke
  secretObjects:
    - secretName: api-gateway-keycloak-admin-credentials
      type: Opaque
      data:
        - objectName: admin-password
          key: password
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_NUMBER}/secrets/support-me-prod-keycloak-admin-password/versions/latest"
        fileName: "admin-password"
