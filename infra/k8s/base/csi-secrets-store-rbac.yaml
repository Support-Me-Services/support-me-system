# GKE's native Secret Manager CSI add-on (enabled via secret_manager_config in
# infra/terraform/modules/gke) mounts secrets into pods fine out of the box, but its
# "sync as Kubernetes Secret" feature (secretObjects: in every SecretProviderClass under
# infra/k8s/base/*/secretproviderclass.yaml - what lets Deployments use a plain secretKeyRef
# instead of reading the CSI-mounted file directly) needs its own ServiceAccount to manage
# Secret objects, which the add-on does NOT grant by default (confirmed by a real failure:
# every db-password/admin-password sync stuck on "FailedToCreateSecret: timed out waiting for
# the condition", with the driver's own logs showing
# "secrets is forbidden: User \"system:serviceaccount:kube-system:secrets-store-csi-driver-gke\"
# cannot list resource \"secrets\" at the cluster scope"). Cluster-scoped because the driver's
# controller watches Secrets across all namespaces, not just this app's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-store-csi-driver-gke-secrets-sync
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-store-csi-driver-gke-secrets-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-store-csi-driver-gke-secrets-sync
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver-gke
    namespace: kube-system
