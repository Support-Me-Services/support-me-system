# Syncs the SAME Secret Manager secret auth/secretproviderclass.yaml uses (the "keycloak" role's
# password) into its own k8s Secret, so the db-init Job doesn't depend on the auth Deployment
# having started/mounted first. The keycloak role is a cloudsqlsuperuser (see
# modules/cloudsql_user/main.tf's comment) so it's the credential used to create the
# organization/initialization schemas below it.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-init-secret
  namespace: support-me
spec:
  provider: gke
  secretObjects:
    - secretName: db-init-db-credentials
      type: Opaque
      data:
        - objectName: db-password
          key: password
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_NUMBER}/secrets/support-me-prod-auth-db-password/versions/latest"
        fileName: "db-password"
