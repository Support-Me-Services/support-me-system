# Replaces the classic networking.k8s.io/Ingress approach (see git history for
# ingress.yaml/managed-certificate.yaml/frontendconfig.yaml/ingressclass.yaml, removed) -
# confirmed by a real failure: this cluster's GKE version has no ingress-gce controller running
# at all
# (`kubectl get pods -A` had nothing matching, `kubectl get ingressclass` was empty even after we
# created one by hand - zero forwarding rules/backend services were ever created, 50+ minutes
# after apply). Only Gateway API GatewayClasses are registered on this cluster
# (gke-l7-global-external-managed and friends) - Ingress-GCE is gone.
#
# gke-l7-global-external-managed = global external Application Load Balancer, matching the
# global static IP already reserved by infra/terraform/modules/edge.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: support-me-gateway
  namespace: support-me
  annotations:
    # GKE-specific bridge to Certificate Manager, confirmed against
    # https://docs.cloud.google.com/kubernetes-engine/docs/how-to/secure-gateway - this is a
    # Gateway-level annotation, NOT a per-listener `tls.options` key (tried that first, based on
    # a wrong guess: got "Error GWCER105: invalid TLS option key" for
    # "networking.gke.io/certificate-map", and a plain listener with no `tls` block at all
    # (no `certificateRefs`/`options`) was rejected too - "certificateRefs or options must be
    # specified when mode is Terminate" - resolved by using this annotation *and* omitting the
    # `tls` block entirely from the https listener below, matching the docs exactly). The
    # certificate + per-hostname map entries are created out-of-band (gcloud certificate-manager
    # certificates/maps/maps entries create - see infra/README.md), not via Terraform yet.
    networking.gke.io/certmap: support-me-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: support-me-prod-ingress-ip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
