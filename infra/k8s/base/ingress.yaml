# ${INGRESS_IP_NAME} substituted by scripts/render-k8s-manifests.sh from
# `terraform output ingress_ip_name` (infra/terraform/environments/prod).
#
# please-support-me.com has no rule here yet - launching on .pl first, cutting over to .com
# later (see infra/terraform/environments/prod/variables.tf's `domains`). To add it back: a
# `host: please-support-me.com` rule identical to the .pl one below, plus add it to
# managed-certificate.yaml's domains.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-me
  namespace: support-me
  annotations:
    kubernetes.io/ingress.global-static-ip-name: ${INGRESS_IP_NAME}
    networking.gke.io/managed-certificates: support-me-cert
    networking.gke.io/v1beta1.FrontendConfig: support-me-frontend-config
spec:
  ingressClassName: gce
  rules:
    - host: please-support-me.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.please-support-me.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    - host: auth.please-support-me.pl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  number: 8080
