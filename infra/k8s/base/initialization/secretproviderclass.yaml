apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: initialization-db-secret
  namespace: support-me
spec:
  provider: gke
  secretObjects:
    - secretName: initialization-db-credentials
      type: Opaque
      data:
        - objectName: db-password
          key: password
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_NUMBER}/secrets/support-me-prod-initialization-db-password/versions/latest"
        fileName: "db-password"
