# Secret name is "...-initialization-shared-..." (not "...-initialization-..."): this role now
# lives on the shared auth_db instance (modules/cloudsql_user's "initialization-shared"
# service_name in environments/prod/main.tf) - suffixed so it doesn't collide with the old, still-
# alive initialization_db module's own secret of (almost) the same name during the migration.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: initialization-db-secret
  namespace: support-me
spec:
  provider: gke
  secretObjects:
    - secretName: initialization-db-credentials
      type: Opaque
      data:
        - objectName: db-password
          key: password
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_NUMBER}/secrets/support-me-prod-initialization-shared-db-password/versions/latest"
        fileName: "db-password"
