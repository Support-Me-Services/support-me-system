apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - csi-secrets-store-rbac.yaml
  - gateway.yaml
  - httproutes.yaml
  - api-gateway/deployment.yaml
  - api-gateway/service.yaml
  - api-gateway/healthcheckpolicy.yaml
  - api-gateway/secretproviderclass.yaml
  - organization/deployment.yaml
  - organization/service.yaml
  - organization/secretproviderclass.yaml
  - initialization/deployment.yaml
  - initialization/service.yaml
  - initialization/secretproviderclass.yaml
  - auth/deployment.yaml
  - auth/service.yaml
  - auth/healthcheckpolicy.yaml
  - auth/secretproviderclass.yaml
  - web/deployment.yaml
  - web/service.yaml

# Support-Me branding for the Keycloak login page (SCRUM-202). Generator (not a static
# ConfigMap) so kustomize appends a content hash to the name and rewrites every reference to
# it - editing a file here forces a new ConfigMap and, because the auth Deployment's pod
# template changes, a rollout - no manual `kubectl rollout restart` needed after a theme change.
configMapGenerator:
  - name: auth-theme-support-me
    files:
      - auth/theme/theme.properties
      - auth/theme/styles.css
      - auth/theme/logo.svg
      - auth/theme/messages_en.properties
      - auth/theme/messages_pl.properties
      - auth/theme/locale.js
