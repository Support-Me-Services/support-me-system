# Google-managed TLS cert covering every public hostname on the currently-launched domain. GKE
# issues and auto-renews it once DNS for all names below points at the ingress IP (see
# infra/terraform/modules/edge) - provisioning can take up to ~60 minutes after DNS propagates,
# and won't even start until DNS is correct.
#
# please-support-me.com is intentionally NOT listed yet - launching on .pl first, cutting over
# to .com later (see infra/terraform/environments/prod/variables.tf's `domains`). When that
# happens, add "please-support-me.com" here (and to ../ingress.yaml's rules) - a
# ManagedCertificate can list both while both are live, so the cutover doesn't need downtime.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: support-me-cert
  namespace: support-me
spec:
  domains:
    - please-support-me.pl
    - api.please-support-me.pl
    - auth.please-support-me.pl
