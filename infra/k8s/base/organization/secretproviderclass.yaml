# Mounts the organization role's password from Secret Manager and syncs it into a native K8s
# Secret (organization-db-credentials) so the Deployment can use a plain secretKeyRef - see
# https://secrets-store-csi-driver.sigs.k8s.io/topics/sync-as-kubernetes-secret.
# ${GCP_PROJECT_NUMBER} substituted by scripts/render-k8s-manifests.sh - Secret Manager's CSI
# provider addresses secrets by project NUMBER, not project ID.
# Secret name is "...-organization-shared-..." (not "...-organization-..."): this role now lives
# on the shared auth_db instance (modules/cloudsql_user's "organization-shared" service_name in
# environments/prod/main.tf) - suffixed so it doesn't collide with the old, still-alive
# organization_db module's own secret of (almost) the same name during the migration.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: organization-db-secret
  namespace: support-me
spec:
  provider: gke
  secretObjects:
    - secretName: organization-db-credentials
      type: Opaque
      data:
        - objectName: db-password
          key: password
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_NUMBER}/secrets/support-me-prod-organization-shared-db-password/versions/latest"
        fileName: "db-password"
