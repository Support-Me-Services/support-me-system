# One KSA per app, each bound to the shared workload GSA via Workload Identity (see
# infra/terraform/modules/gke's google_service_account_iam_member). ${WORKLOAD_GSA_EMAIL} is
# substituted by scripts/render-k8s-manifests.sh from `terraform output workload_service_account_email`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: support-me
  annotations:
    iam.gke.io/gcp-service-account: ${WORKLOAD_GSA_EMAIL}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: organization
  namespace: support-me
  annotations:
    iam.gke.io/gcp-service-account: ${WORKLOAD_GSA_EMAIL}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: initialization
  namespace: support-me
  annotations:
    iam.gke.io/gcp-service-account: ${WORKLOAD_GSA_EMAIL}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
  namespace: support-me
  annotations:
    iam.gke.io/gcp-service-account: ${WORKLOAD_GSA_EMAIL}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: support-me
  annotations:
    iam.gke.io/gcp-service-account: ${WORKLOAD_GSA_EMAIL}
