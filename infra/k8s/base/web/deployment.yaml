apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: support-me
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      containers:
        - name: web
          # NEXT_PUBLIC_* config is baked in at build time (see frontend/apps/web/Dockerfile) -
          # there is nothing to set at runtime here; the image tag itself IS the config.
          image: web
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
